<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ギャラクシー ストライカー</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#03040f;overflow:hidden;color:#fff;font-family:"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);aspect-ratio:4/5;height:min(100vh,125vw)}
canvas{width:100%;height:100%;display:block;border-radius:1.5em;box-shadow:0 0 5em #3ee6ff55}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;background:rgba(3,4,20,.9);text-align:center;border-radius:1.5em}
.ov.on{display:flex}
h1{margin:0;font-size:5.6em;line-height:1.15;text-shadow:0 0 .25em #3ee6ff,0 .05em 0 #ff3b8b}
p{margin:0;font-size:2.6em;line-height:1.4}
button{font:inherit;font-size:3.4em;padding:.2em 1.1em;border:0;border-radius:2em;background:#3ee6ff;color:#00222b;box-shadow:0 .1em 0 #0a9db5,0 0 1em #3ee6ff88;cursor:pointer}
button:active{transform:translateY(.08em);box-shadow:none}
button.s{font-size:2.6em;background:#ffd23f;color:#2a1a00;box-shadow:0 .1em 0 #c98f00}
.rk{font-size:2.3em;line-height:1.45;width:76%;text-align:left}
.rk div{display:flex;justify-content:space-between;padding:0 .6em;border-radius:.6em}
.rk .me{background:#ffd23f;color:#2a1a00}
input{font:inherit;font-size:3em;width:70%;text-align:center;border-radius:.5em;border:.08em solid #3ee6ff;background:#10134a;color:#fff;padding:.1em}
#mu{position:absolute;right:1.5%;top:10.5%;font-size:2.6em;padding:0;background:none;box-shadow:none;color:#fff;opacity:.7}
#rz{position:absolute;left:3%;bottom:2%;font-size:1.5em;padding:.3em .9em;background:#ffffff22;color:#fff;box-shadow:none;opacity:.5}
#pad{position:absolute;left:0;right:0;bottom:1%;display:none;justify-content:space-between;padding:0 3%}
@media(pointer:coarse){#pad{display:flex}}
#pad b{width:19%;aspect-ratio:1;border-radius:50%;background:#ffffff22;border:.25em solid #ffffff55;display:flex;align-items:center;justify-content:center;font-size:5em}
</style></head><body>
<div id="stage">
<canvas id="c" width="480" height="600"></canvas>
<div id="pad"><b id="bl">◀</b><b id="bf">🔥</b><b id="br">▶</b></div>
<button id="mu">🔊</button>
<div class="ov on" id="ti">
 <h1>ギャラクシー<br>ストライカー</h1>
 <p>2ふんかんで たくさん たおそう！<br>【げきむずモード】</p>
 <p style="font-size:2em">👑 ランキング</p>
 <div class="rk" id="rk"></div>
 <button id="go">スタート</button>
 <p style="font-size:1.7em;opacity:.9">うごく ← →　うつ スペース（おしっぱなしOK）<br>3ステージ ＋ ボス！　あたると しばらく うてない！<br>アイテム W=3ほうこう R=れんしゃ S=バリア ♥=ざんき+1</p>
 <button id="rz">ランキングをリセット</button>
</div>
<div class="ov" id="re">
 <h1 id="rt"></h1>
 <p id="rs"></p>
 <div id="ni"><p>なまえを いれてね</p><input id="nm" maxlength="8" autocomplete="off"><br><button class="s" id="ok" style="margin-top:.6em">とうろく</button></div>
 <div class="rk" id="rk2"></div>
 <div><button class="s" id="again">もういちど</button> <button class="s" id="home" style="background:#fff">タイトルへ</button></div>
</div>
</div>
<script>
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),S=$('#stage'),W=480,H=600,R=Math.random,K={};
// ★調整: time=せいげん秒 lives=ざんき bossHp=ボス体力 dropRate=アイテム確率 disable=被弾で撃てない秒数
const CFG={time:120,lives:3,bossHp:90,dropRate:.14,disable:3,fireGap:.24};
const STG=[{rows:4,cols:8,spd:50,shot:.85,ty:[0,0,1,1],dv:3.2},{rows:5,cols:8,spd:56,shot:.65,ty:[2,1,1,0,0],dv:2},{boss:1}],ET=[{hp:1,pt:100},{hp:2,pt:200},{hp:3,pt:400}];
const F='"Hiragino Maru Gothic ProN","BIZ UDPGothic","Yu Gothic",Meiryo,sans-serif',PC=['#ff4d6d','#ffb02e','#b66cff'],IC=['#3ee6ff','#ffd23f','#5df2a6','#ff5ecb'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),esc=s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fit=()=>S.style.fontSize=S.clientHeight/100+'px';addEventListener('resize',fit);fit();
// ---- sprites (pre-rendered neon) ----
const mk=(w,h,f)=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.translate(w/2,h/2);f(x);return c};
const tint=c=>{const t=document.createElement('canvas');t.width=c.width;t.height=c.height;const x=t.getContext('2d');x.drawImage(c,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return t};
function sym(x,p,fill,line,glow,lw=2.5){x.beginPath();x.moveTo(p[0],p[1]);for(let i=2;i<p.length;i+=2)x.lineTo(p[i],p[i+1]);for(let i=p.length-2;i>=0;i-=2)x.lineTo(-p[i],p[i+1]);x.closePath();x.shadowColor=glow||line;x.shadowBlur=12;x.fillStyle=fill;x.fill();x.lineWidth=lw;x.strokeStyle=line;x.stroke();x.shadowBlur=0}
const ES=[[[0,15,8,3,20,-9,13,-12,5,-6,0,-9],'#ff4d6d','#ffa0b0'],[[0,11,9,9,22,-1,22,-11,12,-8,6,-14,0,-10],'#ffb02e','#ffe08a'],[[0,17,15,8,19,-6,9,-17,0,-13],'#b66cff','#ffe066']].map(([p,c,d])=>mk(72,60,x=>{sym(x,p,'#12082a',c);sym(x,p.map(v=>v*.55),d+'44',d,null,1.5);x.shadowColor=c;x.shadowBlur=12;x.fillStyle='#fff';x.beginPath();x.arc(0,0,3.2,0,7);x.fill()})),ESw=ES.map(tint);
const BP=[0,44,16,32,30,40,60,24,92,30,96,8,72,-14,48,-32,20,-42,0,-46];
const BOSS=mk(220,130,x=>{sym(x,BP,'#1d0620','#ff3b5c');sym(x,BP.map(v=>v*.62),'#3a0b2e88','#ffd23f',null,2);x.shadowColor='#ff3b5c';x.shadowBlur=18;x.fillStyle='#fff';[[0,0,9],[-44,10,6],[44,10,6],[-72,22,4],[72,22,4]].forEach(([a,b,r])=>{x.beginPath();x.arc(a,b,r,0,7);x.fill()})}),BOSSw=tint(BOSS);
const PL=mk(80,88,x=>{const p=[0,-28,5,-14,8,2,24,14,27,28,12,22,7,30,0,24];sym(x,p,'#06223a','#3ee6ff');sym(x,p.map(v=>v*.5),'#3ee6ff44','#7df',null,1.5);x.strokeStyle='#ff5ecb';x.lineWidth=2;x.beginPath();x.moveTo(12,12);x.lineTo(23,24);x.moveTo(-12,12);x.lineTo(-23,24);x.stroke();x.shadowColor='#fff';x.shadowBlur=10;x.fillStyle='#e8fdff';x.beginPath();x.ellipse(0,-6,3.5,8,0,0,7);x.fill()});
const ORB=mk(26,26,x=>{const r=x.createRadialGradient(0,0,0,0,0,13);r.addColorStop(0,'#fff');r.addColorStop(.35,'#ff5ecb');r.addColorStop(1,'#ff5ecb00');x.fillStyle=r;x.fillRect(-13,-13,26,26)});
const BG=mk(W,H,x=>{x.translate(-W/2,-H/2);const l=x.createLinearGradient(0,0,0,H);l.addColorStop(0,'#05061c');l.addColorStop(1,'#1a0a3a');x.fillStyle=l;x.fillRect(0,0,W,H);[[120,160,'#3b1d8f'],[380,330,'#7a1f6e'],[200,520,'#0f4a7a']].forEach(([a,b,c])=>{const r=x.createRadialGradient(a,b,0,a,b,190);r.addColorStop(0,c+'88');r.addColorStop(1,c+'00');x.fillStyle=r;x.fillRect(0,0,W,H)})});
// ---- sound ----
let AC,mute=false;
const unlock=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}};
addEventListener('pointerdown',unlock);addEventListener('keydown',unlock);
function snd(f,e,d,ty='square',v=.06){if(mute||!AC)return;try{const o=AC.createOscillator(),a=AC.createGain(),n=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(e,20),n+d);a.gain.setValueAtTime(v,n);a.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(a);a.connect(AC.destination);o.start(n);o.stop(n+d)}catch(x){}}
// ---- ranking ----
const KEY='galaxyStrikerRank2';let mem=[];
const load=()=>{try{return JSON.parse(localStorage.getItem(KEY))||mem}catch(e){return mem}};
const save=a=>{mem=a;try{localStorage.setItem(KEY,JSON.stringify(a))}catch(e){}};
function rank(el,n,me){const a=load().slice(0,n);el.innerHTML=a.length?a.map((r,i)=>`<div class="${i==me?'me':''}"><span>${['🥇','🥈','🥉'][i]||i+1+'.'} ${esc(r.n)}</span><b>${r.s.toLocaleString()}てん</b></div>`).join(''):'<div><span>まだ だれも いないよ！</span></div>'}
const show=id=>document.querySelectorAll('.ov').forEach(o=>o.classList.toggle('on',o.id==id));
// ---- state ----
let st='title',kind='',stage=0,score=0,kills=0,lives=3,left=0,cmb=0,cmbT=0,sp=0,pr=0,sd=0,dis=0,introT=0,fireT=0,eT=0,ufoT=0,dvT=0,shake=0,flash=0,fc='255,255,255',ox=0,oy=0,dir=1,total=1,gc=7,fin=0,T=0,last=0,iv=[],bl=[],eb=[],it=[],pt=[],ft=[],ufo=null,boss=null;
const sh={x:W/2,y:H-96,inv:0},stars=Array.from({length:70},()=>({x:R()*W,y:R()*H,z:.6+R()*1.6}));
const ix=v=>(W-(gc-1)*48)/2+v.c*48+ox+(v.dx||0),iy=v=>128+v.r*40+oy+(v.dy||0);
function start(){stage=0;score=kills=0;left=CFG.time;lives=CFG.lives;cmb=cmbT=sp=pr=sd=dis=0;pt=[];ft=[];sh.x=W/2;sh.inv=0;shake=flash=0;setup();show('')}
function setup(){const s=STG[stage];iv=[];bl=[];eb=[];it=[];ufo=null;boss=null;ufoT=6+R()*4;dvT=5;ox=oy=0;dir=1;fireT=0;eT=1;
 if(s.boss)boss={x:W/2,y:-90,hp:CFG.bossHp,max:CFG.bossHp,f:0,at:1.6,rt:.8,t:0};
 else{gc=s.cols;for(let r=0;r<s.rows;r++)for(let c=0;c<s.cols;c++)iv.push({c,r,k:s.ty[r],hp:ET[s.ty[r]].hp,f:0});total=iv.length}
 st='intro';introT=2.4;snd(s.boss?150:440,s.boss?150:880,.6,s.boss?'sawtooth':'square',.07)}
function boom(x,y,c,n=22){for(let i=0;i<n;i++){const a=R()*6.28,s=60+R()*220,l=.4+R()*.5;pt.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:200,l,L:l,s:2+R()*4,c:R()<.25?'#fff':c})}pt.push({x,y,r:6,vr:280,l:.35,L:.35,c,ring:1})}
const pickKind=()=>{const r=R();return r<.35?0:r<.65?1:r<.9?2:3};
function kill(v){const x=ix(v),y=iy(v);v.dead=1;cmb=cmbT>0?Math.min(5,cmb+1):1;cmbT=1.2;const p=ET[v.k].pt*cmb;score+=p;kills++;boom(x,y,PC[v.k]);ft.push({x,y:y-16,t:'+'+p,c:'#fff',l:.7,L:.7,z:16});snd(280,40,.22,'sawtooth',.05);shake=Math.max(shake,3);if(R()<(v.k==2?.4:CFG.dropRate))it.push({x,y,k:pickKind()})}
function pick(k){score+=50;snd(660,1320,.15,'triangle',.07);boom(sh.x,sh.y,IC[k],14);ft.push({x:sh.x,y:sh.y-46,t:['3WAY！','RAPID！','BARRIER！','ざんき +1！'][k],c:IC[k],l:1.1,L:1.1});if(k==0)sp=8;else if(k==1)pr=6;else if(k==2)sd=1;else lives=Math.min(5,lives+1)}
function hitUfo(){score+=1000;boom(ufo.x,84,'#ff5ecb',40);boom(ufo.x,84,'#fff',16);ft.push({x:ufo.x,y:106,t:'UFO +1000',c:'#ffd23f',l:1.4,L:1.4});it.push({x:ufo.x,y:84,k:pickKind()});shake=8;flash=.4;fc='255,255,255';snd(500,1500,.35,'square',.07);ufo=null;ufoT=9+R()*5}
function hurt(){if(sh.inv>0||st!='play')return;
 if(sd){sd=0;sh.inv=1;shake=6;boom(sh.x,sh.y,'#5df2a6',20);snd(300,900,.2,'triangle',.08);return}
 lives--;cmb=0;dis=CFG.disable;sh.inv=2.2;shake=14;flash=.6;fc='255,60,80';boom(sh.x,sh.y,'#3ee6ff',34);ft.push({x:sh.x,y:sh.y-46,t:'ショート！ うてない！',c:'#ff6b6b',l:1.6,L:1.6});snd(220,40,.4,'sawtooth',.1);
 if(lives<=0){boom(sh.x,sh.y,'#fff',40);endGame('over')}}
function bossDown(){const x=boss.x,y=boss.y;score+=5000;for(let i=0;i<12;i++)setTimeout(()=>{boom(x+(R()-.5)*160,y+(R()-.5)*80,i%2?'#ffd23f':'#ff3b5c',28);snd(200,40,.3,'sawtooth',.07);shake=10},i*110);ft.push({x:W/2,y:H/2-70,t:'BOSS撃破！ +5000',c:'#ffd23f',l:2.2,L:2.2});boss=null;endGame('clear')}
function endGame(k){st='end';kind=k;eb=[];bl=[];it=[];ufo=null;if(k=='clear'){const b=Math.floor(left)*100;score+=b;ft.push({x:W/2,y:H/2-20,t:'のこりタイム +'+b,c:'#ffd23f',l:2.4,L:2.4});[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,f,.25,'square',.07),i*150+600))}fin=score;setTimeout(res,k=='clear'?3000:1600)}
function res(){const a=load(),q=fin>0&&(a.length<10||fin>a[a.length-1].s);$('#rt').textContent={clear:'ぜんクリア！！',time:'タイムアップ！',over:'ゲームオーバー'}[kind];$('#rs').innerHTML=`<b style="font-size:1.6em;color:#ffd23f">${fin.toLocaleString()}てん</b><br><small style="font-size:.7em;opacity:.85">ステージ ${Math.min(stage+1,3)} ／ たおした数 ${kills}</small>`;$('#ni').style.display=q?'block':'none';$('#nm').value='';rank($('#rk2'),10,-1);show('re');if(q)setTimeout(()=>$('#nm').focus(),150)}
// ---- update ----
function upd(dt){
 for(const s of stars){s.y+=s.z*(st=='play'?40:18)*dt;if(s.y>H){s.y=0;s.x=R()*W}}
 pt=pt.filter(p=>(p.l-=dt)>0);for(const p of pt){if(p.ring)p.r+=p.vr*dt;else{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt}}
 ft=ft.filter(f=>(f.l-=dt)>0);for(const f of ft)f.y-=34*dt;
 shake=Math.max(0,shake-45*dt);flash=Math.max(0,flash-2.2*dt);
 if(st=='end'&&kind=='clear'&&R()<.7)pt.push({x:R()*W,y:-10,vx:(R()-.5)*60,vy:60+R()*120,g:20,l:3.5,L:3.5,s:5+R()*4,c:IC[R()*4|0]});
 if(st!='intro'&&st!='play')return;
 sh.x=clamp(sh.x+((K.ArrowRight||K.KeyD||K.R?1:0)-(K.ArrowLeft||K.KeyA||K.L?1:0))*320*dt,24,W-24);
 sh.inv=Math.max(0,sh.inv-dt);dis=Math.max(0,dis-dt);sp=Math.max(0,sp-dt);pr=Math.max(0,pr-dt);
 if(dis>0&&R()<.6)pt.push({x:sh.x+(R()-.5)*40,y:sh.y+(R()-.5)*40,vx:(R()-.5)*120,vy:(R()-.5)*120,g:0,l:.25,L:.25,s:3,c:'#7df'});
 if(st=='intro'){introT-=dt;if(boss)boss.y+=(135-boss.y)*Math.min(1,dt*3);if(introT<=0)st='play';return}
 left-=dt;if(left<=0){left=0;endGame('time');return}
 cmbT-=dt;if(cmbT<=0)cmb=0;
 fireT-=dt;
 if((K.Space||K.ArrowUp||K.KeyW||K.F)&&fireT<=0&&dis<=0){fireT=pr>0?.11:CFG.fireGap;const n=sp>0?3:1;for(let i=0;i<n;i++){const a=(i-(n-1)/2)*.2;bl.push({x:sh.x,y:sh.y-28,vx:Math.sin(a)*580,vy:-Math.cos(a)*580})}snd(900,260,.08,'square',.035)}
 const s=STG[stage];
 if(iv.length){
  const fm=iv.filter(v=>!v.dv);ox+=dir*(s.spd+(1-iv.length/total)*s.spd*3)*dt;let mn=1e9,mx=-1e9;for(const v of fm){const x=ix(v);mn=Math.min(mn,x);mx=Math.max(mx,x)}
  if(dir>0&&mx+22>W-8){dir=-1;oy+=18}else if(dir<0&&mn-22<8){dir=1;oy+=18}
  if(fm.length&&Math.max(...fm.map(iy))+20>sh.y-36){oy-=90;flash=.5;fc='255,80,80';ft.push({x:W/2,y:H/2,t:'ちかすぎる！',c:'#ff6b6b',l:1.2,L:1.2});hurt()}
  dvT-=dt;if(dvT<=0&&fm.length>2){dvT=s.dv*(.6+R()*.8);const v=fm[R()*fm.length|0];v.dv=1;v.dx=0;v.dy=0;snd(700,200,.3,'sawtooth',.03)}for(const v of iv)if(v.dv){if(v.ret){v.dy+=170*dt;v.dx*=1-dt*2;if(v.dy>=0){v.dv=v.ret=0;v.dx=v.dy=0}}else{v.dy+=(stage?330:270)*dt;v.dx+=clamp(sh.x-ix(v),-1,1)*(stage?150:110)*dt;if(iy(v)>H+30){v.ret=1;v.dy=-(iy(v)-v.dy)-40}else if(sh.inv<=0&&Math.hypot(ix(v)-sh.x,iy(v)-sh.y)<28){v.dead=1;boom(ix(v),iy(v),PC[v.k]);hurt()}}}eT-=dt;if(eT<=0&&fm.length){eT=(.6+R()*.8)*s.shot;let v=fm[R()*fm.length|0];if(R()<.45)v=fm.reduce((a,b)=>Math.abs(ix(b)-sh.x)<Math.abs(ix(a)-sh.x)?b:a);const x=ix(v),y=iy(v)+18,bs=stage?280:230;let vx=0,vy=bs;if(R()<(stage?.7:.35)){const a=Math.atan2(sh.y-y,sh.x-x);vx=Math.cos(a)*bs;vy=Math.sin(a)*bs}eb.push({x,y,vx,vy});if(stage&&R()<.25)for(const d of[-.3,.3]){const a=Math.atan2(vy,vx)+d;eb.push({x,y,vx:Math.cos(a)*bs,vy:Math.sin(a)*bs})}snd(320,120,.1,'sawtooth',.02)}
 }
 if(boss){const b=boss;b.t+=dt;b.x=W/2+Math.sin(b.t*(1.1+(1-b.hp/b.max)*.9))*160;b.f=Math.max(0,b.f-dt);b.at-=dt;b.rt-=dt;
  const p=b.hp<b.max/3?2:b.hp<b.max*2/3?1:0;
  if(b.at<=0){b.at=1.2-p*.25;const n=5+p*2,a0=Math.atan2(sh.y-b.y,sh.x-b.x);for(let i=0;i<n;i++){const a=a0+(i-(n-1)/2)*.24;eb.push({x:b.x,y:b.y+34,vx:Math.cos(a)*255,vy:Math.sin(a)*255})}snd(160,90,.2,'sawtooth',.05)}
  if(b.rt<=0){b.rt=.55-p*.14;eb.push({x:R()*W,y:-6,vx:0,vy:290})}}
 if(!s.boss){ufoT-=dt;if(!ufo&&ufoT<=0&&iv.length>3){const d=R()<.5?1:-1;ufo={x:d>0?-30:W+30,d,u:0}}
  if(ufo){ufo.x+=ufo.d*115*dt;ufo.u+=dt;if(ufo.x<-40||ufo.x>W+40){ufo=null;ufoT=9+R()*5}else if(Math.floor(ufo.u*9)!=Math.floor((ufo.u-dt)*9))snd(Math.floor(ufo.u*9)%2?980:760,760,.07,'sine',.03)}}
 for(const b of bl){b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(const v of iv){if(v.dead)continue;if(Math.abs(b.x-ix(v))<22&&Math.abs(b.y-iy(v))<19){b.dead=1;if(--v.hp<=0)kill(v);else{v.f=.12;boom(b.x,b.y,'#fff',5);snd(520,300,.07,'triangle',.05)}break}}
  if(!b.dead&&ufo&&Math.abs(b.x-ufo.x)<30&&Math.abs(b.y-84)<16){b.dead=1;hitUfo()}
  if(!b.dead&&boss&&Math.abs(b.x-boss.x)<84&&Math.abs(b.y-boss.y)<44){b.dead=1;boss.hp--;boss.f=.07;score+=20;boom(b.x,b.y,'#fff',4);snd(420,260,.05,'triangle',.04);if(boss.hp<=0)bossDown()}}

 if(st!='play')return;
 for(const b of eb){b.x+=b.vx*dt;b.y+=b.vy*dt;if(Math.hypot(b.x-sh.x,b.y-sh.y)<15){b.dead=1;hurt()}}

 if(st=='play'&&!boss&&!iv.length){score+=1000;ft.push({x:W/2,y:H/2-40,t:'STAGE CLEAR！ +1000',c:'#5df2a6',l:1.6,L:1.6});flash=.5;fc='255,255,255';snd(523,1047,.4,'square',.07);stage++;setup()}

const txt=(t,x,y,z,c,a=1)=>{g.globalAlpha=a;g.font=`bold ${z}px ${F}`;g.shadowColor=c;g.shadowBlur=14;g.fillStyle=c;g.fillText(t,x,y);g.shadowBlur=0;g.globalAlpha=1};

 g.textAlign='left';g.font=`bold 13px ${F}`;g.fillStyle='#8fb4ff';g.fillText('スコア',14,18);txt(score.toLocaleString(),14,48,30,'#fff');

 for(let i=0;i<lives;i++)g.drawImage(PL,W-14-(i+1)*24,6,24,26);
 g.textAlign='right';g.font=`bold 14px ${F}`;g.fillStyle=STG[stage].boss?'#ff5a6e':'#8fb4ff';g.fillText(STG[stage].boss?'BOSS':'STAGE '+(stage+1),W-14,56);
 if(boss){const w=280,x=(W-w)/2;g.fillStyle='#ffffff22';g.fillRect(x,68,w,8);g.fillStyle='#ff3b5c';g.fillRect(x,68,w*clamp(boss.hp/boss.max,0,1),8)}
 let n=0;[[sp,8,IC[0],'W'],[pr,6,IC[1],'R'],[sd,1,IC[2],'S']].forEach(([v,mx,c,l])=>{if(v>0){const y=H-40-n++*18;g.textAlign='left';g.font=`bold 13px ${F}`;g.fillStyle=c;g.fillText(l,14,y+9);g.fillStyle=c+'33';g.fillRect(30,y,70,8);g.fillStyle=c;g.fillRect(30,y,70*v/mx,8)}});
 g.textAlign='center';
 if(st=='intro'){const a=Math.min(1,introT*1.5);if(boss){txt('WARNING!!',W/2,H/2,62,'#ff3b5c',a*(.6+.4*Math.sin(T*16)));txt('ボスが あらわれた！',W/2,H/2+42,26,'#fff',a)}else{txt('STAGE '+(stage+1),W/2,H/2,64,'#3ee6ff',a);txt(stage?'つよい てきが くるぞ！':'ぜんぶ たおせ！',W/2,H/2+42,26,'#fff',a)}}
 if(st=='end')txt({clear:'ALL CLEAR!!',time:'TIME UP!',over:'GAME OVER'}[kind],W/2,H/2+60,56,kind=='clear'?'#ffd23f':'#ff4d6d')}
function draw(){
 g.save();if(shake>0)g.translate((R()-.5)*shake,(R()-.5)*shake);
 g.drawImage(BG,-10,-10,W+20,H+20);
 for(const s of stars){g.fillStyle=`rgba(255,255,255,${.2+s.z*.25})`;g.fillRect(s.x,s.y,s.z,s.z*(st=='play'?3:1.2))}
 if(st!='title'){
  const low=iv.length?Math.max(...iv.map(iy)):0;g.setLineDash([8,8]);g.strokeStyle=low>380?`rgba(255,80,80,${.5+.4*Math.sin(T*12)})`:'rgba(255,255,255,.1)';g.lineWidth=2;g.beginPath();g.moveTo(0,sh.y-36);g.lineTo(W,sh.y-36);g.stroke();g.setLineDash([]);
  for(const v of iv)g.drawImage((v.f>0?ESw:ES)[v.k],ix(v)-36,iy(v)-30+Math.sin(T*3+v.c)*2);

  for(const i of it)item(i);
  g.globalCompositeOperation='lighter';g.lineCap='round';g.lineWidth=4;g.strokeStyle='#9ff';for(const b of bl){g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x-b.vx*.04,b.y-b.vy*.04);g.stroke()}g.globalCompositeOperation='source-over';
  for(const b of eb)g.drawImage(ORB,b.x-13,b.y-13);
  if(!(st=='end'&&kind=='over'))ship()}
 g.globalCompositeOperation='lighter';
 for(const p of pt){g.globalAlpha=clamp(p.l*2/p.L,0,1);if(p.ring){g.strokeStyle=p.c;g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.stroke()}else{g.fillStyle=p.c;g.fillRect(p.x,p.y,p.s,p.s)}}
 g.globalAlpha=1;g.globalCompositeOperation='source-over';
 g.textAlign='center';g.lineWidth=5;g.strokeStyle='#070826';
 for(const f of ft){g.font=`bold ${f.z||26}px ${F}`;g.globalAlpha=clamp(f.l*2,0,1);g.fillStyle=f.c;const x=clamp(f.x,90,W-90);g.strokeText(f.t,x,f.y);g.fillText(f.t,x,f.y)}
 g.globalAlpha=1;g.restore();
 if(flash>0){g.fillStyle=`rgba(${fc},${flash*.4})`;g.fillRect(0,0,W,H)}
 if(st!='title')hud()}
function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;upd(dt);draw();requestAnimationFrame(loop)}
